name: Run Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: show_arch
      run: |
        uname -m
        cc -dumpmachine

    - name: install_dependencies_linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libpcap-dev clang

    - name: install_dependencies_macos
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: build
      run: |
        cp profiles/pcap_profile.cmake profile.cmake
        ./build.sh
      working-directory: build

    - name: build_integration_tests
      run: |
        ./build_pcap_tests.sh
      working-directory: tests/integration_tests_pcap/build

    - name: run_integration_tests
      run: |
        sudo ./run_tests
      working-directory: tests/integration_tests_pcap/output
