name: Run Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-arm64
            os: windows-11-arm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: install_dependencies_linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libpcap-dev clang libdpdk-dev

    - name: install_dependencies_macos
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: install_dependencies_windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm cmake make -y --no-progress

        $sdk = "$env:RUNNER_TEMP\npcap-sdk.zip"
        $dest = "$env:RUNNER_TEMP\npcap-sdk"

        Invoke-WebRequest `
          -Uri "https://npcap.com/dist/npcap-sdk-1.17.zip" `
          -OutFile $sdk

        Expand-Archive -Path $sdk -DestinationPath $dest -Force

        $header = Get-ChildItem $dest -Filter pcap.h -Recurse | Select-Object -First 1
        if (!$header) {
          throw "Npcap SDK headers not found"
        }

        $sdkRoot = $header.Directory.Parent.FullName

        if (!(Test-Path "$sdkRoot\Lib\ARM64\wpcap.lib")) {
          throw "ARM64 wpcap.lib missing"
        }

        if (!(Test-Path "$sdkRoot\Lib\ARM64\Packet.lib")) {
          throw "ARM64 Packet.lib missing"
        }

        "NPCAP_SDK=$sdkRoot" >> $env:GITHUB_ENV

    - name: build_integration_tests_pcap
      if: runner.os == 'Linux' || runner.os == 'macOS'
      run: |
        ./build_pcap_tests.sh
      working-directory: tests/integration_tests/build

    - name: run_integration_tests_pcap
      if: runner.os == 'Linux' || runner.os == 'macOS'
      run: |
        sudo ./run_tests
      working-directory: tests/integration_tests/output

    - name: build_integration_tests_pcap_win
      if: runner.os == 'Windows'
      run: |
        ./build_pcap_tests.bat
      working-directory: tests/integration_tests/build

    - name: enable_hugepages
      if: runner.os == 'Linux'
      run: sudo sysctl -w vm.nr_hugepages=128

    - name: build_integration_tests_dpdk
      if: runner.os == 'Linux'
      run: |
        ./build_dpdk_tests.sh
      working-directory: tests/integration_tests/build

    - name: run_integration_tests_dpdk
      if: runner.os == 'Linux'
      run: |
        sudo ./run_tests
      working-directory: tests/integration_tests/output
